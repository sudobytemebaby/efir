name: Go

on:
  workflow_call:
    inputs:
      has-proto:
        description: Whether proto files were generated
        type: string
        required: false
        default: "false"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go + Proto
        uses: ./.github/actions/setup-go-proto
        with:
          generate: "false"

      - name: Download generated proto files
        if: inputs.has-proto == 'true'
        uses: actions/download-artifact@v4
        with:
          name: proto-generated
          path: services/shared/gen

      - name: Install golangci-lint v2
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0

      - name: Run golangci-lint across all workspace modules
        run: bash .github/scripts/lint-go-modules.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go + Proto
        uses: ./.github/actions/setup-go-proto
        with:
          generate: "false"

      - name: Download generated proto files
        if: inputs.has-proto == 'true'
        uses: actions/download-artifact@v4
        with:
          name: proto-generated
          path: services/shared/gen

      - name: Run tests with coverage
        run: bash .github/scripts/test-go-modules.sh

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 3
