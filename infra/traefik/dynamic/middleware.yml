http:
  middlewares:
    rate-limit:
      rateLimit:
        average: 100
        period: 1m
        burst: 50

    cors:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PATCH
          - DELETE
          - OPTIONS
        accessControlAllowOriginList:
          - "http://localhost:5173"
        accessControlAllowHeaders:
          - "Content-Type"
        accessControlExposeHeaders:
          - "X-Request-ID"
        accessControlAllowCredentials: true
        accessControlMaxAge: 86400

    # Forward auth for WebSocket ticket validation
    # The Gateway service validates tickets via /auth/validate
    ws-forward-auth:
      forwardAuth:
        address: "http://gateway:8080/auth/validate"
        trustForwardHeader: true
        authResponseHeaders:
          - "X-User-Id"

    # Generate: htpasswd -nb admin yourpassword
    dashboard-auth:
      basicAuth:
        users:
          - "admin:$apr1$xyz$hashedpassword"

  routers:
    dashboard:
      rule: "Host(`localhost`)"
      service: api@internal
      entryPoints:
        - traefik
