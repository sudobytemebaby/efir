worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    # Rate limiting — per IP, 100 req/min with burst of 50
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;

    # CORS: only allow known origins; unknown origins get an empty string
    map $http_origin $cors_origin {
        "http://localhost:5173" $http_origin;
        default                 "";
    }

    # Docker's internal DNS — resolves container names at request time, not startup
    resolver 127.0.0.11 valid=30s;

    # ── API Gateway ───────────────────────────────────────────────────────────
    server {
        listen      80;
        server_name api.localhost;

        location / {
            # CORS preflight
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin      $cors_origin;
                add_header Access-Control-Allow-Credentials true;
                add_header Access-Control-Allow-Methods     "GET, POST, PATCH, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers     "Content-Type";
                add_header Access-Control-Max-Age           86400;
                return 204;
            }

            limit_req zone=api burst=50 nodelay;

            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Expose-Headers    "X-Request-ID" always;

            set $gateway http://efir-gateway:8080;
            proxy_pass         $gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # ── WebSocket ─────────────────────────────────────────────────────────────
    server {
        listen      80;
        server_name ws.localhost;

        location / {
            # Validate WS ticket before proxying; extracts X-User-Id from response
            auth_request     /internal/validate;
            auth_request_set $user_id $upstream_http_x_user_id;

            set $websocket http://efir-websocket:8081;
            proxy_pass         $websocket;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-User-Id  $user_id;
        }

        # Internal subrequest — not reachable from outside
        location = /internal/validate {
            internal;

            set $gateway http://efir-gateway:8080;
            proxy_pass              $gateway/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            proxy_set_header        X-Ws-Ticket    $http_x_ws_ticket;
        }
    }

    # ── Internal health check ─────────────────────────────────────────────────
    server {
        listen      8080;
        server_name _;
        access_log  off;

        location = /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
