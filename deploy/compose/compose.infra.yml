# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

services:
  postgres:
    image: postgres:18-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - efir-network

  nats:
    image: nats:2.12-alpine
    env_file:
      - .env
    command:
      - "-c"
      - "/etc/nats/nats.conf"
    volumes:
      - ./infra/nats/nats.conf:/etc/nats/nats.conf:ro
      - nats_data:/var/lib/nats
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - efir-network

  valkey:
    image: valkey/valkey:9-alpine
    env_file:
      - .env
    command: sh -c 'exec valkey-server /etc/valkey/valkey.conf --requirepass "$${VALKEY_PASSWORD:-valkey}"'
    volumes:
      - ./infra/valkey/valkey.conf:/etc/valkey/valkey.conf:ro
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'valkey-cli -a "$VALKEY_PASSWORD" ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - efir-network

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - efir-network

volumes:
  postgres_data:
  nats_data:
  valkey_data:

networks:
  efir-network:
    external: true
