# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

services:
  auth:
    build:
      context: .
      dockerfile: ./services/auth/Containerfile
    env_file:
      - .env
    environment:
      - POSTGRES_DSN=${POSTGRES_AUTH_DSN}
    volumes:
      - ./services/auth/internal/config/config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - efir-network

  user:
    build:
      context: .
      dockerfile: ./services/user/Containerfile
    env_file:
      - .env
    environment:
      - POSTGRES_DSN=${POSTGRES_USER_DSN}
    volumes:
      - ./services/user/internal/config/config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - efir-network

  room:
    build:
      context: .
      dockerfile: ./services/room/Containerfile
    env_file:
      - .env
    environment:
      - POSTGRES_DSN=${POSTGRES_ROOM_DSN}
    volumes:
      - ./services/room/internal/config/config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - efir-network

  message:
    build:
      context: .
      dockerfile: ./services/message/Containerfile
    env_file:
      - .env
    environment:
      - POSTGRES_DSN=${POSTGRES_MESSAGE_DSN}
      - ROOM_SERVICE_ADDR=${ROOM_SERVICE_ADDR}
    volumes:
      - ./services/message/internal/config/config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      room:
        condition: service_started
    networks:
      - efir-network

  websocket:
    build:
      context: .
      dockerfile: ./services/websocket/Containerfile
    env_file:
      - .env
    environment:
      - GATEWAY_URL=${GATEWAY_URL:-http://gateway:8080}
    volumes:
      - ./services/websocket/internal/config/config.yaml:/app/config.yaml:ro
    depends_on:
      nats:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - efir-network

  gateway:
    build:
      context: .
      dockerfile: ./services/gateway/Containerfile
    env_file:
      - .env
    volumes:
      - ./services/gateway/internal/config/config.yaml:/app/config.yaml:ro
    depends_on:
      valkey:
        condition: service_healthy
    networks:
      - efir-network

networks:
  efir-network:
    external: true
